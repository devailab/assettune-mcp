# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  BIN: bin/assettune-mcp
  IMAGE_CLI: cmd/image/main.go
  VIDEO_CLI: cmd/video/main.go

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the MCP server binary
    cmds:
      - go build -o {{.BIN}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.BIN}}"

  run:
    desc: Build and run the MCP server
    deps: [build]
    cmds:
      - ./{{.BIN}}

  test:
    desc: Run all tests with verbose output
    cmds:
      - go test ./... -v -timeout 120s

  image:
    desc: "Optimize images. Usage: task image [DIR=media/images] [QUALITY=80] [MAX_DIM=0] [OVERWRITE=true]"
    vars:
      DIR: '{{.DIR | default "media/images"}}'
      QUALITY: '{{.QUALITY | default "80"}}'
      MAX_DIM: '{{.MAX_DIM | default "0"}}'
      OVERWRITE: '{{.OVERWRITE | default "true"}}'
    cmds:
      - go run {{.IMAGE_CLI}} -dir {{.DIR}} -quality {{.QUALITY}} -max-dimension {{.MAX_DIM}} {{if eq .OVERWRITE "false"}}-overwrite=false{{end}}

  video:
    desc: "Optimize videos to web MP4. Usage: task video [DIR=media/videos] [OVERWRITE=true]"
    vars:
      DIR: '{{.DIR | default "media/videos"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "0"}}'
      OVERWRITE: '{{.OVERWRITE | default "true"}}'
    cmds:
      - go run {{.VIDEO_CLI}} -dir {{.DIR}} -concurrency {{.CONCURRENCY}} {{if eq .OVERWRITE "false"}}-overwrite=false{{end}}

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy and verify go modules
    cmds:
      - go mod tidy
      - go mod verify

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BIN}}

  clean:optimized:
    desc: Delete all *_optimized.mp4 and *_optimized.webp files
    cmds:
      - cmd: find . -type f \( -name '*_optimized.mp4' -o -name '*_optimized.webp' \) -print -delete
        ignore_error: true
