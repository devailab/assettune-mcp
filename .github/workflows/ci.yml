name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  BINARY_NAME: assettune-mcp

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules are tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Verify build
        run: go build -o /tmp/${{ env.BINARY_NAME }} .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run unit tests
        run: go test ./... -short -timeout 60s -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  test-integration:
    name: Integration tests (libvips + ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libvips and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev ffmpeg

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run all tests
        run: go test ./... -timeout 180s -race -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build CLI tools
        run: |
          mkdir -p dist
          go build -o dist/${{ env.BINARY_NAME }} .
          go build -o dist/assettune-image ./cmd/image
          go build -o dist/assettune-video ./cmd/video

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-amd64
          path: dist/*
          retention-days: 3
